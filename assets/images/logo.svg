<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" fill="none">
  <!-- Icon: Book base -->
  <g transform="translate(10, 10)">
    <!-- Left page -->
    <path d="M8 22 C8 18 12 16 18 16 L48 16 L48 78 L18 78 C12 78 8 80 8 84 Z" fill="#e63946"/>
    <!-- Right page -->
    <path d="M48 16 L78 16 C84 16 88 18 88 22 L88 84 C88 80 84 78 78 78 L48 78 Z" fill="#c42c39"/>
    <!-- Book spine highlight -->
    <rect x="46" y="16" width="4" height="62" fill="#ffffff" opacity="0.35"/>
    <!-- Page lines -->
    <rect x="14" y="30" width="26" height="2.5" rx="1.25" fill="#ffffff" opacity="0.55"/>
    <rect x="14" y="40" width="26" height="2.5" rx="1.25" fill="#ffffff" opacity="0.55"/>
    <rect x="14" y="50" width="20" height="2.5" rx="1.25" fill="#ffffff" opacity="0.55"/>
    <rect x="56" y="30" width="26" height="2.5" rx="1.25" fill="#ffffff" opacity="0.55"/>
    <rect x="56" y="40" width="26" height="2.5" rx="1.25" fill="#ffffff" opacity="0.55"/>
    <rect x="56" y="50" width="20" height="2.5" rx="1.25" fill="#ffffff" opacity="0.55"/>

    <!-- Graduation cap -->
    <path d="M14 6 L48 -8 L82 6 L48 20 Z" fill="#1f2933"/>
    <path d="M48 20 L82 6 L82 14 L48 28 L14 14 L14 6 Z" fill="#111827" opacity="0.15"/>
    <!-- Tassel -->
    <line x1="82" y1="6" x2="82" y2="26" stroke="#f4a261" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="82" cy="28" r="3.5" fill="#f4a261"/>

    <!-- Star accent (South Sudan) -->
    <path d="M48 -22 L51 -14 L59.5 -14 L52.8 -8.8 L55.3 -1 L48 -5.8 L40.7 -1 L43.2 -8.8 L36.5 -14 L45 -14 Z" fill="#f2be3e"/>
  </g>

  <!-- Brand text -->
  <g transform="translate(130, 20)">
    <!-- SSD -->
    <text x="0" y="34" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="34" font-weight="800" fill="#e63946" letter-spacing="-1">SSD</text>
    <!-- STUDY GUIDES -->
    <text x="0" y="66" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2933" letter-spacing="3.5">STUDY GUIDES</text>
    <!-- Tagline -->
    <text x="1" y="88" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="11" font-weight="500" fill="#6b7280" letter-spacing="0.5">Learn. Revise. Succeed.</text>
  </g>
</svg>